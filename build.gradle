plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"

base {
	archivesName = 'swordai'
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"swordai" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Everything below is nested into the mod jar so players install a single file.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	include "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// For training only, the game can run on Carpet PvP (a fork of Carpet whose fake players fight by
	// themselves, https://modrinth.com/mod/carpet-pvp-practice) instead, for an opponent not written
	// here: gradlew runClient -PcarpetPvp=<its jar>. The mod is still built against Carpet and ships with it.
	if (project.hasProperty('carpetPvp')) {
		modCompileOnly "maven.modrinth:carpet:${project.carpet_version}"
		modLocalRuntime files(project.property('carpetPvp'))
	} else {
		modImplementation "maven.modrinth:carpet:${project.carpet_version}"
	}
	include "maven.modrinth:carpet:${project.carpet_version}"

	implementation project(':core')
	include project(':core')
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

javadoc {
	// The mod's own classes, client side included, with every member: the comments are written on all of them.
	source += sourceSets.client.allJava
	classpath += sourceSets.client.compileClasspath
	options.memberLevel = JavadocMemberLevel.PRIVATE
	options.encoding = 'UTF-8'
	options.charSet = 'UTF-8'
	options.windowTitle = 'SwordAI mod'
	options.docTitle = 'SwordAI mod: the client, the trainer, the arena and its bots'
	options.addStringOption('Xdoclint:none', '-quiet')
}
